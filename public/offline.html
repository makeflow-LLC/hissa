<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال | منصة حصة</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .box { max-width: 420px; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.35rem; margin: 16px 0 8px; }
      p { color: #64748b; line-height: 1.9; margin: 0 0 20px; }
      button {
        background: #4f46e5;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        font-size: 1rem;
        font-family: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/logo.svg" alt="منصة حصة" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        تعذّر تحميل الصفحة لأن جهازك غير متصل. تأكّد من اتصالك ثم أعد المحاولة —
        دروسك وتقدّمك محفوظة في حسابك.
      </p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
